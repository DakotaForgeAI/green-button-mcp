[project]
name = "green-button-mcp"
version = "0.1.0"
description = "Read-only MCP server that answers questions about your electricity usage from a Green Button (NAESB ESPI) XML file."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dakota Forge Energy LLC" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "defusedxml>=0.7",
]
keywords = ["mcp", "green-button", "espi", "electricity", "energy", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest>=8", "tzdata; sys_platform == 'win32'"]

[project.scripts]
green-button-mcp = "green_button_mcp.server:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/green_button_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
